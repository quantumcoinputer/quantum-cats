name: Request IBM reviewer access
description: Request read-only access to the IBM instance behind a Quantum Cats batch.
title: "IBM reviewer access"
body:
  - type: markdown
    attributes:
      value: |
        Everyone is welcome to review. Owning a cat is optional.
        Public archives and source code are available immediately.
        Direct IBM access requires an IBM account and an individual invitation.
        This issue starts a maintainer-assisted request; it does not grant access automatically.
        Keep your IBM email, API keys, wallet keys, and account credentials out of this public issue.
        Arrange a private contact channel with the maintainer before providing the invitation email.
  - type: input
    id: job
    attributes:
      label: Token, batch, or IBM job to review
      description: Use a public token ID, contract address, batch number, or IBM job ID.
      placeholder: "Testnet token 1, job daeinh642tqs73aupkm0"
    validations:
      required: true
  - type: dropdown
    id: account
    attributes:
      label: Do you have an IBM Cloud account?
      options:
        - "Yes"
        - I will create one
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Review questions (optional)
      description: Include technical questions or access problems. Keep personal account details private.
