name: CI

on:
  push:
    branches: [master]
    # Routine batch publications do not change the software under test.
    paths-ignore: ['archive/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Contracts, oracle, and Qiskit verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-review.txt

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: stable
          cache: false

      - name: Install dependencies
        run: |
          npm ci
          python3 -m pip install -r requirements-review.txt

      - name: Test contracts
        run: |
          mkdir -p out-svg
          forge test

      - name: Test oracle archive handling
        run: npm run test:oracle

      - name: Check generated art tables
        run: |
          npm run gen:data
          git diff --exit-code -- contracts/CatData.sol

      - name: Build the Qiskit circuit without submitting a job
        run: python3 quantum/submit_job.py --dry-run

      - name: Verify archived hardware circuits against the published experiment
        shell: bash
        run: |
          set -euo pipefail
          for archive in \
            archive/job-daerfrdnj4cs73afi230.json \
            archive/job-daeinh642tqs73aupkm0.json; do
            python3 quantum/check_equivalence.py "$archive" > "$RUNNER_TEMP/equivalence.json"
            # The verifier can return zero for unavailable checks; require an explicit pass.
            python3 -c 'import json,sys; result=json.load(open(sys.argv[1])); print(result); assert result["status"] == "pass", result' "$RUNNER_TEMP/equivalence.json"
          done
